# Adds the PostgreSQL 18 client tools (pg_dump / pg_restore / psql) to the
# Railway build image — used by the database backup jobs (src/scripts/backup.ts).
# The live database runs PostgreSQL 18, and a dump client older than the server
# refuses to run against it (Ubuntu noble's own client is 16).
#
# Nixpacks still auto-detects this as a Node app from package.json; this file
# only extends the setup phase with one extra nix package and names the start
# command.
[phases.setup]
nixPkgs = ["postgresql_18"]

[start]
cmd = "pnpm start"
